# Reusable workflow: publish a WordPress plugin ZIP to Underdog Unlimited.
#
# Callers handle `on: release` / `workflow_dispatch`, compute version,
# and invoke this workflow with inputs.

name: Publish Plugin

on:
  workflow_call:
    inputs:
      target_environment:
        description: "GitHub Environment name in the CALLER repo (staging or production) — used to resolve env-scoped secrets like UU_PUBLISH_TOKEN"
        required: true
        type: string
      plugin_slug:
        description: "UU Admin slug / ZIP folder name (e.g. player-management)"
        required: true
        type: string
      bootstrap_php:
        description: "Main plugin PHP filename at repo root (e.g. player-management.php)"
        required: true
        type: string
      version:
        description: "Version to publish (e.g. 2.7.20 or 2.7.20-rc3, without leading v)"
        required: true
        type: string
      changelog:
        description: "Release notes / changelog text (optional)"
        required: false
        type: string
        default: ""
      channel:
        description: "Publish channel: release|prerelease|dev. Leave empty to infer from version (X.Y.Z→release, -rc→prerelease, other suffix→dev)."
        required: false
        type: string
        default: ""
      publish_url:
        description: "Underdog Unlimited publish base URL"
        required: false
        type: string
        default: "https://plugins.underdogunlimited.com"
    secrets:
      UU_PUBLISH_TOKEN:
        description: "Publish token (udpub_…)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          SLUG: ${{ inputs.plugin_slug }}
          BOOTSTRAP: ${{ inputs.bootstrap_php }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$SLUG" ]]; then
            echo "::error::plugin_slug input is required"
            exit 1
          fi
          if [[ -z "$BOOTSTRAP" ]]; then
            echo "::error::bootstrap_php input is required"
            exit 1
          fi
          if [[ ! -f "$BOOTSTRAP" ]]; then
            echo "::error::Bootstrap file $BOOTSTRAP not found at repo root"
            exit 1
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::version input is required"
            exit 1
          fi
          # Strip leading v if caller passed one
          VERSION="${VERSION#v}"
          # Validate version format: semver with optional fourth segment and prerelease
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3, 1.2.3.1, or 1.2.3-rc1 (got: $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated: slug=$SLUG, bootstrap=$BOOTSTRAP, version=$VERSION"
        id: validate

      - name: Setup PHP
        if: ${{ hashFiles('composer.json') != '' && hashFiles('composer.lock') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Build plugin ZIP
        env:
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p "dist/${SLUG}"

          # Exclude dev/CI artifacts; align with typical deploy.sh excludes
          # Note: vendor/ is excluded here so we don't ship whatever is committed
          # (may be incomplete or include dev deps). We install production deps below.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='dist' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='cypress' \
            --exclude='docs' \
            --exclude='coverage' \
            --exclude='.phpunit.result.cache' \
            --exclude='.taskfiles' \
            --exclude='wp-admin' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.xml.dist' \
            --exclude='Taskfile.yaml' \
            --exclude='*.log' \
            --exclude='debug.log' \
            --exclude='*.sh' \
            --exclude='*.md' \
            --exclude='*.list' \
            --exclude='run-*.php' \
            --exclude='.DS_Store' \
            --exclude='*.swp' \
            --exclude='*~' \
            ./ "dist/${SLUG}/"

          # Restore README after *.md exclude (common plugin convention)
          if [[ -f README.md ]]; then
            cp README.md "dist/${SLUG}/README.md"
          fi

          # Install production Composer dependencies if composer.json and composer.lock exist
          if [[ -f composer.json && -f composer.lock ]]; then
            echo "::group::Installing production Composer dependencies"
            cp composer.json composer.lock "dist/${SLUG}/"
            (
              cd "dist/${SLUG}"
              composer install --no-dev --optimize-autoloader --no-interaction --no-progress
            )
            echo "::endgroup::"

            # Gate: autoload.php must exist after composer install
            if [[ ! -f "dist/${SLUG}/vendor/autoload.php" ]]; then
              echo "::error::Composer install failed: dist/${SLUG}/vendor/autoload.php is missing"
              exit 1
            fi
            echo "✓ vendor/autoload.php present"

            # Gate: check for dev dependency leakage in autoloader files
            DEV_LEAK_PATTERN='deep-copy|phpunit|mockery|brain/monkey|yoast'
            AUTOLOAD_FILES="dist/${SLUG}/vendor/composer/autoload_files.php"
            AUTOLOAD_STATIC="dist/${SLUG}/vendor/composer/autoload_static.php"
            LEAK_FOUND=0

            if [[ -f "$AUTOLOAD_FILES" ]] && grep -qEi "$DEV_LEAK_PATTERN" "$AUTOLOAD_FILES"; then
              echo "::error::Dev dependency leakage detected in autoload_files.php"
              grep -Ei "$DEV_LEAK_PATTERN" "$AUTOLOAD_FILES" || true
              LEAK_FOUND=1
            fi

            if [[ -f "$AUTOLOAD_STATIC" ]] && grep -qEi "$DEV_LEAK_PATTERN" "$AUTOLOAD_STATIC"; then
              echo "::error::Dev dependency leakage detected in autoload_static.php"
              grep -Ei "$DEV_LEAK_PATTERN" "$AUTOLOAD_STATIC" || true
              LEAK_FOUND=1
            fi

            if [[ $LEAK_FOUND -eq 1 ]]; then
              echo "::error::Production build contains dev dependencies. Check composer.json require-dev."
              exit 1
            fi
            echo "✓ No dev dependency leakage detected"

            # Remove composer.json/lock from staging dir (not needed in final ZIP)
            rm -f "dist/${SLUG}/composer.json" "dist/${SLUG}/composer.lock"
          else
            echo "No composer.json + composer.lock at repo root; skipping Composer install"
          fi

          (
            cd dist
            zip -r "../${SLUG}-${VERSION}.zip" "$SLUG"
          )

          echo "ZIP=$(pwd)/${SLUG}-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "Built ZIP:"
          unzip -l "${SLUG}-${VERSION}.zip" | head -40

      - name: Publish to Underdog Unlimited
        env:
          UU_PUBLISH_TOKEN: ${{ secrets.UU_PUBLISH_TOKEN }}
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ inputs.version }}
          PUBLISH_URL: ${{ inputs.publish_url }}
          CHANGELOG: ${{ inputs.changelog }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          VERSION="${VERSION#v}"

          if [[ -z "$UU_PUBLISH_TOKEN" ]]; then
            echo "::error::Missing secret UU_PUBLISH_TOKEN"
            exit 1
          fi

          PUBLISH_BASE="${PUBLISH_URL:-https://plugins.underdogunlimited.com}"
          PUBLISH_BASE="${PUBLISH_BASE%/}"

          # Determine channel: use input if valid, otherwise infer from version
          infer_channel() {
            local ver="$1"
            if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release"
            elif [[ "$ver" =~ [-+].*[Rr][Cc] ]]; then
              echo "prerelease"
            else
              echo "dev"
            fi
          }

          if [[ "$CHANNEL_INPUT" =~ ^(release|prerelease|dev)$ ]]; then
            CHANNEL="$CHANNEL_INPUT"
            echo "Using explicit channel: $CHANNEL"
          else
            CHANNEL="$(infer_channel "$VERSION")"
            echo "Inferred channel from version '$VERSION': $CHANNEL"
          fi

          printf '%s' "$CHANGELOG" > /tmp/changelog.txt

          curl -fsS -X POST "${PUBLISH_BASE}/api/plugins/v1/${SLUG}/publish" \
            -H "Authorization: Bearer ${UU_PUBLISH_TOKEN}" \
            -F "version=${VERSION}" \
            -F "channel=${CHANNEL}" \
            -F "changelog=</tmp/changelog.txt" \
            -F "file=@${ZIP};type=application/zip"

          echo "Published ${SLUG}@${VERSION} (channel=${CHANNEL}) to ${PUBLISH_BASE}"
