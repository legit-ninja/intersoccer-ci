# Reusable workflow: publish a WordPress plugin ZIP to Underdog Unlimited.
#
# Callers handle `on: release` / `workflow_dispatch`, compute version,
# and invoke this workflow with inputs.

name: Publish Plugin

on:
  workflow_call:
    inputs:
      target_environment:
        description: "GitHub Environment name in the CALLER repo (staging or production) — used to resolve env-scoped secrets like UU_PUBLISH_TOKEN"
        required: true
        type: string
      plugin_slug:
        description: "UU Admin slug / ZIP folder name (e.g. player-management)"
        required: true
        type: string
      bootstrap_php:
        description: "Main plugin PHP filename at repo root (e.g. player-management.php)"
        required: true
        type: string
      version:
        description: "Version to publish (e.g. 2.7.20 or 2.7.20-rc3, without leading v)"
        required: true
        type: string
      changelog:
        description: "Release notes / changelog text (optional)"
        required: false
        type: string
        default: ""
      channel:
        description: "Publish channel: release|prerelease|dev. Leave empty to infer from version (X.Y.Z→release, -rc→prerelease, other suffix→dev)."
        required: false
        type: string
        default: ""
      publish_url:
        description: "Underdog Unlimited publish base URL (https only; set via caller vars.UU_PUBLISH_URL)"
        required: false
        type: string
      include_vendor:
        description: "If true, keep committed vendor/ in the publish ZIP. Default false excludes vendor/ (same as today). Use for plugins that commit vendor/ and must ship it (e.g. reports-rosters). Does not run composer install."
        required: false
        type: boolean
        default: false
      package_type:
        description: "Package kind: plugin or theme (default plugin)"
        required: false
        type: string
        default: "plugin"
    secrets:
      UU_PUBLISH_TOKEN:
        description: "Publish token (udpub_…)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate inputs
        env:
          SLUG: ${{ inputs.plugin_slug }}
          BOOTSTRAP: ${{ inputs.bootstrap_php }}
          VERSION: ${{ inputs.version }}
          PACKAGE_TYPE: ${{ inputs.package_type }}
        run: |
          if [[ -z "$SLUG" ]]; then
            echo "::error::plugin_slug input is required"
            exit 1
          fi
          if [[ -z "$BOOTSTRAP" ]]; then
            echo "::error::bootstrap_php input is required"
            exit 1
          fi
          if [[ ! -f "$BOOTSTRAP" ]]; then
            echo "::error::Bootstrap file $BOOTSTRAP not found at repo root"
            exit 1
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::version input is required"
            exit 1
          fi
          PKG_TYPE="$(echo "${PACKAGE_TYPE:-plugin}" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [[ "$PKG_TYPE" != "plugin" && "$PKG_TYPE" != "theme" ]]; then
            echo "::error::package_type must be plugin or theme (got: ${PACKAGE_TYPE})"
            exit 1
          fi
          # Strip leading v if caller passed one
          VERSION="${VERSION#v}"
          # Validate version format: semver with optional fourth segment and prerelease
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Version must look like X.Y.Z or X.Y.Z-prerelease (got: $VERSION)"
            exit 1
          fi
          read_header_version() {
            local file="$1"
            grep -iE '^[ \t*]*Version:' "$file" | head -n1 | sed -E 's/^[ \t*]*Version:[ \t]*//; s/[ \t]*$//'
          }
          if [[ "$PKG_TYPE" == "theme" ]]; then
            if [[ ! -f style.css ]]; then
              echo "::error::style.css not found at repo root (required for theme package_type)"
              exit 1
            fi
            HEADER_VER="$(read_header_version style.css)"
          else
            HEADER_VER="$(read_header_version "$BOOTSTRAP")"
          fi
          if [[ -z "$HEADER_VER" ]]; then
            echo "::error::Could not read Version header from package metadata"
            exit 1
          fi
          if [[ "$HEADER_VER" != "$VERSION" ]]; then
            echo "::error::Version header (${HEADER_VER}) does not match publish version (${VERSION})"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated: slug=$SLUG, bootstrap=$BOOTSTRAP, version=$VERSION, package_type=$PKG_TYPE"
        id: validate

      - name: Check version is three-part
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # UU rejects four-segment versions, so fail here before the ZIP build.
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::UU only accepts three-part versions (X.Y.Z or X.Y.Z-prerelease)"
            exit 1
          fi
          echo "Version $VERSION is three-part"

      - name: Build plugin ZIP
        env:
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ inputs.version }}
          INCLUDE_VENDOR: ${{ inputs.include_vendor }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p "dist/${SLUG}"

          # Exclude dev/CI artifacts; align with typical deploy.sh excludes.
          # Patterns without a leading slash match at any depth. Patterns with
          # a leading slash only match at the plugin root.
          RSYNC_EXCLUDES=(
            --exclude='.git'
            --exclude='.github'
            --exclude='.gitignore'
            --exclude='.env*'
            --exclude='.vscode'
            --exclude='.idea'
            --exclude='auth.json'
            --exclude='*.map'
            --exclude='*.sql'
            --exclude='dist'
            --exclude='node_modules'
            --exclude='tests'
            --exclude='cypress'
            --exclude='docs'
            --exclude='coverage'
            --exclude='.phpunit.result.cache'
            --exclude='.taskfiles'
            --exclude='wp-admin'
            --exclude='composer.json'
            --exclude='composer.lock'
            --exclude='package.json'
            --exclude='package-lock.json'
            --exclude='phpunit.xml'
            --exclude='phpunit.xml.dist'
            --exclude='Taskfile.yaml'
            --exclude='*.log'
            --exclude='debug.log'
            --exclude='*.sh'
            # Root only, so licence/readme files of bundled libraries are kept.
            --exclude='/*.md'
            --exclude='*.list'
            --exclude='run-*.php'
            --exclude='.DS_Store'
            --exclude='*.swp'
            --exclude='*~'
          )

          # rsync applies the first rule that matches, so includes go first.
          # Self-hosted assets in nested vendor folders (for example
          # js/vendor/ or css/vendor/) always ship whole, licence files included.
          RSYNC_FILTERS=(--include='*/vendor/***')

          if [[ "${INCLUDE_VENDOR}" == "true" ]]; then
            # Keep the committed top-level Composer vendor/ as-is.
            RSYNC_FILTERS+=(--include='/vendor/***' "${RSYNC_EXCLUDES[@]}")
            echo "include_vendor=true: keeping committed vendor/ in ZIP (no composer install)"
          else
            # Only the top-level Composer vendor/ is dropped, not nested ones.
            RSYNC_FILTERS+=("${RSYNC_EXCLUDES[@]}" --exclude='/vendor')
            echo "include_vendor=false: excluding top-level vendor/ from ZIP"
          fi

          rsync -a "${RSYNC_FILTERS[@]}" ./ "dist/${SLUG}/"

          # Restore README after the root *.md exclude (common plugin convention)
          if [[ -f README.md ]]; then
            cp README.md "dist/${SLUG}/README.md"
          fi

          (
            cd dist
            zip -r "../${SLUG}-${VERSION}.zip" "$SLUG"
          )

          echo "ZIP=$(pwd)/${SLUG}-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "Built ZIP:"
          # sed reads all input, so a large listing cannot trip pipefail the
          # way head would.
          unzip -l "${SLUG}-${VERSION}.zip" | sed -n '1,40p'

      - name: Check ZIP contents
        env:
          SLUG: ${{ inputs.plugin_slug }}
          INCLUDE_VENDOR: ${{ inputs.include_vendor }}
        run: |
          # Fail before publishing if packaging dropped files that must ship.
          # Generic: works from the repo's own file list, no plugin paths.
          if [[ -z "${ZIP:-}" || ! -f "${ZIP}" ]]; then
            echo "::error::Built ZIP not found (ZIP=${ZIP:-unset})"
            exit 1
          fi

          FORBIDDEN=0
          while IFS= read -r entry; do
            base="${entry##*/}"
            if [[ "$base" == .env* ]] || [[ "$entry" == */.git/* ]] || [[ "$entry" == */.git ]] || [[ "$base" == *.sql ]] || [[ "$base" == *.map ]] || [[ "$entry" == */.vscode/* ]] || [[ "$entry" == */.vscode ]] || [[ "$entry" == */.idea/* ]] || [[ "$entry" == */.idea ]] || [[ "$base" == auth.json ]]; then
              echo "::error::Forbidden path in ZIP: ${entry}"
              FORBIDDEN=1
            fi
          done < <(unzip -Z1 "$ZIP")
          if [[ "$FORBIDDEN" -ne 0 ]]; then
            echo "ZIP contains forbidden paths; not publishing."
            exit 1
          fi

          # Byte-order sorting so sort and comm agree.
          export LC_ALL=C
          WORK="$(mktemp -d)"

          # ZIP entries relative to the plugin folder.
          unzip -Z1 "$ZIP" \
            | awk -v p="${SLUG}/" 'index($0, p) == 1 { print substr($0, length(p) + 1) }' \
            | sort -u > "$WORK/zip.txt"

          # Source files: tracked files from the checkout.
          git -c core.quotePath=false ls-files | sort -u > "$WORK/src.txt"
          if [[ ! -s "$WORK/src.txt" ]]; then
            echo "::error::Could not list source files with git ls-files"
            exit 1
          fi

          # 1) Every file under a nested vendor folder (anything like
          #    <dir>/vendor/..., outside the top-level vendor/) must be in the
          #    ZIP, as long as <dir> itself ships. Folders that are dropped on
          #    purpose (tests/, docs/, ...) are skipped.
          awk '
            FNR == NR {
              p = $0
              isdir = sub(/\/$/, "", p)
              if (p == "") next
              inzip[p] = 1
              if (isdir) dirs[p] = 1
              while ((j = match(p, /\/[^\/]*$/)) > 0) {
                p = substr(p, 1, j - 1)
                dirs[p] = 1
              }
              next
            }
            /^vendor\// { next }
            {
              i = index($0, "/vendor/")
              if (i == 0) next
              parent = substr($0, 1, i - 1)
              if (!(parent in dirs)) { skipped++; next }
              base = $0
              sub(/.*\//, "", base)
              ub = toupper(base)
              islic = (ub ~ /^LICEN[CS]E/ || ub ~ /\.MD$/)
              checked++
              if (islic) lic++
              if (!($0 in inzip)) print (islic ? "licence" : "file") "\t" $0
            }
            END {
              printf "nested vendor files checked: %d (licence/readme: %d), skipped (parent folder not shipped): %d\n", checked, lic, skipped > "/dev/stderr"
            }
          ' "$WORK/zip.txt" "$WORK/src.txt" > "$WORK/missing.tsv"

          FAILED=0
          if [[ -s "$WORK/missing.tsv" ]]; then
            FAILED=1
            echo "::error::$(wc -l < "$WORK/missing.tsv") file(s) under nested vendor folders are missing from the ZIP"
            while IFS=$'\t' read -r kind path; do
              echo "::error::Missing ${kind} from ZIP: ${path}"
            done < <(head -n 50 "$WORK/missing.tsv")
          fi

          # 2) Top-level Composer vendor/ must follow include_vendor.
          ZIP_VENDOR_COUNT="$(grep -c '^vendor/' "$WORK/zip.txt" || true)"
          if [[ "${INCLUDE_VENDOR}" == "true" ]]; then
            grep '^vendor/' "$WORK/src.txt" > "$WORK/src-vendor.txt" || true
            comm -23 "$WORK/src-vendor.txt" "$WORK/zip.txt" > "$WORK/missing-vendor.txt"
            MISSING_VENDOR="$(wc -l < "$WORK/missing-vendor.txt")"
            if [[ "$MISSING_VENDOR" -gt 0 ]]; then
              FAILED=1
              echo "::error::include_vendor=true but ${MISSING_VENDOR} committed vendor/ file(s) are missing from the ZIP"
              sed -n '1,20s/^/::error::Missing vendor file: /p' "$WORK/missing-vendor.txt"
            fi
          elif [[ "$ZIP_VENDOR_COUNT" -gt 0 ]]; then
            FAILED=1
            echo "::error::include_vendor=false but the ZIP contains a top-level vendor/ (${ZIP_VENDOR_COUNT} entries)"
          fi

          if [[ "$FAILED" -ne 0 ]]; then
            echo "ZIP content check failed; not publishing."
            exit 1
          fi
          echo "ZIP content check passed (top-level vendor/ entries: ${ZIP_VENDOR_COUNT}, include_vendor=${INCLUDE_VENDOR})."

      - name: Publish to Underdog Unlimited
        env:
          UU_PUBLISH_TOKEN: ${{ secrets.UU_PUBLISH_TOKEN }}
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ inputs.version }}
          PUBLISH_URL: ${{ inputs.publish_url }}
          CHANGELOG: ${{ inputs.changelog }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          VERSION="${VERSION#v}"

          if [[ -z "$UU_PUBLISH_TOKEN" ]]; then
            echo "::error::Missing secret UU_PUBLISH_TOKEN"
            exit 1
          fi

          if [[ -z "${PUBLISH_URL// }" ]]; then
            echo "::error::publish_url input is required (set repository or environment variable UU_PUBLISH_URL on the caller)"
            exit 1
          fi
          PUBLISH_BASE="${PUBLISH_URL%/}"
          if [[ ! "$PUBLISH_BASE" =~ ^https:// ]]; then
            echo "::error::publish_url must start with https://"
            exit 1
          fi

          # Determine channel: use input if valid, otherwise infer from version
          infer_channel() {
            local ver="$1"
            if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release"
            elif [[ "$ver" =~ [-+].*[Rr][Cc] ]]; then
              echo "prerelease"
            else
              echo "dev"
            fi
          }

          if [[ "$CHANNEL_INPUT" =~ ^(release|prerelease|dev)$ ]]; then
            CHANNEL="$CHANNEL_INPUT"
            echo "Using explicit channel: $CHANNEL"
          else
            CHANNEL="$(infer_channel "$VERSION")"
            echo "Inferred channel from version '$VERSION': $CHANNEL"
          fi

          printf '%s' "$CHANGELOG" > /tmp/changelog.txt

          curl -fsS -X POST "${PUBLISH_BASE}/api/plugins/v1/${SLUG}/publish" \
            -H "Authorization: Bearer ${UU_PUBLISH_TOKEN}" \
            -F "version=${VERSION}" \
            -F "channel=${CHANNEL}" \
            -F "changelog=</tmp/changelog.txt" \
            -F "file=@${ZIP};type=application/zip"

          echo "Published ${SLUG}@${VERSION} (channel=${CHANNEL}) to ${PUBLISH_BASE}"
